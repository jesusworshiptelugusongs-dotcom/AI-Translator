<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Telugu Lyrics AI Translator</title>

<style>

body{
margin:0;
padding:30px;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.container{
max-width:1000px;
margin:auto;
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#0d47a1;
}

textarea{
width:100%;
height:320px;
padding:15px;
font-size:18px;
border:1px solid #ccc;
border-radius:8px;
resize:vertical;
box-sizing:border-box;
}

button{
margin-top:20px;
width:100%;
padding:15px;
font-size:18px;
background:#1565c0;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#0d47a1;
}

.resultBox{
margin-top:25px;
background:#fafafa;
padding:15px;
border-radius:8px;
border:1px solid #ddd;
white-space:pre-wrap;
}

.copyBtn{
margin-top:10px;
background:#2e7d32;
}

</style>

</head>

<body>

<div class="container">

<h1>🎵 Telugu Lyrics AI Translator</h1>

<textarea
id="lyrics"
placeholder="ఇక్కడ తెలుగు పాట Paste చేయండి..."></textarea>

<button id="generateBtn">
Generate Translation
</button>

<div class="resultBox">

<h2>English Transliteration</h2>

<div id="transliteration">
Waiting...
</div>

<button class="copyBtn">
Copy
</button>

</div>

<div class="resultBox">

<h2>English Translation</h2>

<div id="translation">
Waiting...
</div>

<button class="copyBtn">
Copy
</button>

</div>

<div class="resultBox">

<h2>Blogger HTML</h2>

<div id="htmlcode">
Waiting...
</div>

<button class="copyBtn">
Copy
</button>

</div>

</div>

</body>
</html>
